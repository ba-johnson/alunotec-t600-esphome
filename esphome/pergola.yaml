esphome:
  name: "pergola"
  friendly_name: Pergola

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:
  level: DEBUG
  baud_rate: 0


# Enable Home Assistant API
api:
  encryption:
    key: !secret t600_api_key
ota:
  - platform: esphome
    password: !secret esphome_ota_pw

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "T600-Pergola Fallback Hotspot"
    password: !secret fallback_password

captive_portal:

uart:
  id: rs485_uart
  tx_pin: GPIO17
  rx_pin: GPIO18
  baud_rate: 9600
  data_bits: 8
  stop_bits: 1
  parity: NONE
  rx_buffer_size: 256
  debug:
    direction: BOTH
    after:
      timeout: 100ms
    sequence:
      - lambda: |-
          UARTDebug::log_hex(direction, bytes, ' ');

globals:
  - id: frame_no
    type: uint8_t
    initial_value: '1'

script:
  - id: send_t600_frame
    parameters:
      motor_addr: int
      device_type: int
      command_code: int
      data_addr: int
      data_value: int
    then:
      - lambda: |-
          auto crc16_modbus = [](const std::vector<uint8_t> &data) -> uint16_t {
            uint16_t crc = 0xFFFF;
            for (auto b : data) {
              crc ^= b;
              for (int i = 0; i < 8; i++) {
                if (crc & 0x0001) {
                  crc >>= 1;
                  crc ^= 0xA001;
                } else {
                  crc >>= 1;
                }
              }
            }
            return crc;
          };

          std::vector<uint8_t> pkt = {
            0x55,
            id(frame_no),
            0xFE,
            (uint8_t) motor_addr,
            (uint8_t) device_type,
            (uint8_t) command_code,
            (uint8_t) data_addr,
            (uint8_t) data_value
          };

          uint16_t crc = crc16_modbus(pkt);
          pkt.push_back(crc & 0xFF);
          pkt.push_back((crc >> 8) & 0xFF);

          id(rs485_uart).write_array(pkt.data(), pkt.size());
          id(rs485_uart).flush();

          id(frame_no)++;
          if (id(frame_no) == 0 || id(frame_no) == 0xFF) id(frame_no) = 1;

cover:
  - platform: time_based
    name: "Pergola Roof"
    id: pergola_roof
    device_class: blind
    assumed_state: true
    has_built_in_endstop: false
    open_duration: 25.5s
    close_duration: 25.5s

    open_action:
      - script.execute:
          id: send_t600_frame
          motor_addr: 0x11
          device_type: 0x00
          command_code: 0x03
          data_addr: 0x01
          data_value: 0x01

    close_action:
      - script.execute:
          id: send_t600_frame
          motor_addr: 0x11
          device_type: 0x00
          command_code: 0x03
          data_addr: 0x01
          data_value: 0x02

    stop_action:
      - script.execute:
          id: send_t600_frame
          motor_addr: 0x11
          device_type: 0x00
          command_code: 0x03
          data_addr: 0x01
          data_value: 0x00

  - platform: template
    name: "Pergola House Blind"
    device_class: blind
    optimistic: true
    open_action:
      - script.execute: { id: send_t600_frame, motor_addr: 0x02, device_type: 0x00, command_code: 0x03, data_addr: 0x01, data_value: 0x01 }
    close_action:
      - script.execute: { id: send_t600_frame, motor_addr: 0x02, device_type: 0x00, command_code: 0x03, data_addr: 0x01, data_value: 0x02 }
    stop_action:
      - script.execute: { id: send_t600_frame, motor_addr: 0x02, device_type: 0x00, command_code: 0x03, data_addr: 0x01, data_value: 0x00 }

  - platform: template
    name: "Pergola Front Blind"
    device_class: blind
    optimistic: true
    open_action:
      - script.execute: { id: send_t600_frame, motor_addr: 0x03, device_type: 0x00, command_code: 0x03, data_addr: 0x01, data_value: 0x01 }
    close_action:
      - script.execute: { id: send_t600_frame, motor_addr: 0x03, device_type: 0x00, command_code: 0x03, data_addr: 0x01, data_value: 0x02 }
    stop_action:
      - script.execute: { id: send_t600_frame, motor_addr: 0x03, device_type: 0x00, command_code: 0x03, data_addr: 0x01, data_value: 0x00 }

  - platform: template
    name: "Pergola Fence Blind"
    device_class: blind
    optimistic: true
    open_action:
      - script.execute: { id: send_t600_frame, motor_addr: 0x04, device_type: 0x00, command_code: 0x03, data_addr: 0x01, data_value: 0x01 }
    close_action:
      - script.execute: { id: send_t600_frame, motor_addr: 0x04, device_type: 0x00, command_code: 0x03, data_addr: 0x01, data_value: 0x02 }
    stop_action:
      - script.execute: { id: send_t600_frame, motor_addr: 0x04, device_type: 0x00, command_code: 0x03, data_addr: 0x01, data_value: 0x00 }

  - platform: template
    name: "Pergola Back Blind"
    device_class: blind
    optimistic: true
    open_action:
      - script.execute: { id: send_t600_frame, motor_addr: 0x05, device_type: 0x00, command_code: 0x03, data_addr: 0x01, data_value: 0x01 }
    close_action:
      - script.execute: { id: send_t600_frame, motor_addr: 0x05, device_type: 0x00, command_code: 0x03, data_addr: 0x01, data_value: 0x02 }
    stop_action:
      - script.execute: { id: send_t600_frame, motor_addr: 0x05, device_type: 0x00, command_code: 0x03, data_addr: 0x01, data_value: 0x00 }

output:
  - platform: template
    id: wy_power_output
    type: binary
    write_action:
      - if:
          condition:
            lambda: 'return state;'
          then:
            - script.execute:
                id: send_t600_frame
                motor_addr: 0xFE
                device_type: 0x02
                command_code: 0x03
                data_addr: 0x02
                data_value: 0x01
          else:
            - script.execute:
                id: send_t600_frame
                motor_addr: 0xFE
                device_type: 0x02
                command_code: 0x03
                data_addr: 0x02
                data_value: 0x00

  - platform: template
    id: rgb_power_output
    type: binary
    write_action:
      - if:
          condition:
            lambda: 'return state;'
          then:
            - script.execute:
                id: send_t600_frame
                motor_addr: 0xFE
                device_type: 0x01
                command_code: 0x03
                data_addr: 0x02
                data_value: 0x01
          else:
            - script.execute:
                id: send_t600_frame
                motor_addr: 0xFE
                device_type: 0x01
                command_code: 0x03
                data_addr: 0x02
                data_value: 0x00

light:
  - platform: binary
    name: "Pergola Roof Lights"
    output: wy_power_output

  - platform: binary
    name: "Pergola RGB Lights"
    output: rgb_power_output

number:
  - platform: template
    name: "Pergola Roof Lights Brightness"
    id: pergola_roof_lights_brightness
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 100
    step: 1
    set_action:
      - lambda: |-
          id(send_t600_frame)->execute(0xFE, 0x02, 0x03, 0x03, (int)x);

  - platform: template
    name: "Pergola RGB Lights Brightness"
    id: pergola_rgb_lights_brightness
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 100
    step: 1
    set_action:
      - lambda: |-
          id(send_t600_frame)->execute(0xFE, 0x01, 0x03, 0x03, (int)x);

select:
  - platform: template
    name: "Pergola Roof Light Mode"
    optimistic: true
    restore_value: true
    initial_option: "Cool"
    options:
      - Cool
      - Warm
    set_action:
      - lambda: |-
          id(send_t600_frame)->execute(0xFE, 0x02, 0x03, 0x04, x == "Cool" ? 0x00 : 0x01);
      - delay: 100ms
      - lambda: |-
          id(send_t600_frame)->execute(0xFE, 0x02, 0x03, 0x03, (int) id(pergola_roof_lights_brightness).state);

  - platform: template
    name: "Pergola RGB Preset"
    optimistic: true
    restore_value: true
    initial_option: "White"
    options:
      - Red
      - Green
      - Blue
      - Yellow
      - Cyan
      - Purple
      - White
      - Gradient
    set_action:
      - lambda: |-
          uint8_t v = 0x06;
          if (x == "Red") v = 0x00;
          else if (x == "Green") v = 0x01;
          else if (x == "Blue") v = 0x02;
          else if (x == "Yellow") v = 0x03;
          else if (x == "Cyan") v = 0x04;
          else if (x == "Purple") v = 0x05;
          else if (x == "White") v = 0x06;
          else if (x == "Gradient") v = 0x07;

          id(send_t600_frame)->execute(0xFE, 0x01, 0x03, 0x05, v);
      - delay: 100ms
      - lambda: |-
          id(send_t600_frame)->execute(0xFE, 0x01, 0x03, 0x03, (int) id(pergola_rgb_lights_brightness).state);

button:
  - platform: template
    name: "Pergola Roof Read Status (Raw)"
    on_press:
      - lambda: |-
          auto crc16_modbus = [](const std::vector<uint8_t> &data) -> uint16_t {
            uint16_t crc = 0xFFFF;
            for (auto b : data) {
              crc ^= b;
              for (int i = 0; i < 8; i++) {
                if (crc & 0x0001) {
                  crc >>= 1;
                  crc ^= 0xA001;
                } else {
                  crc >>= 1;
                }
              }
            }
            return crc;
          };

          // Frame: READ motor status (0x30) for roof (0x11)
          std::vector<uint8_t> pkt = {
            0x55,
            id(frame_no),
            0xFE,
            0x11,   // roof group
            0x00,   // motor device
            0x01,   // READ
            0x30,   // status register
            0x00    // value ignored
          };

          uint16_t crc = crc16_modbus(pkt);
          pkt.push_back(crc & 0xFF);
          pkt.push_back((crc >> 8) & 0xFF);

          id(rs485_uart).write_array(pkt.data(), pkt.size());
          id(rs485_uart).flush();

          ESP_LOGD("t600", "Sent roof status read");

  - platform: template
    name: "Pergola Roof Lights Read Power"
    on_press:
      - script.execute:
          id: send_t600_frame
          motor_addr: 0xFE
          device_type: 0x02
          command_code: 0x01
          data_addr: 0x31
          data_value: 0x00

  - platform: template
    name: "Pergola Roof Lights Read Brightness"
    on_press:
      - script.execute:
          id: send_t600_frame
          motor_addr: 0xFE
          device_type: 0x02
          command_code: 0x01
          data_addr: 0x32
          data_value: 0x00

  - platform: template
    name: "Pergola RGB Read Power"
    on_press:
      - script.execute:
          id: send_t600_frame
          motor_addr: 0xFE
          device_type: 0x01
          command_code: 0x01
          data_addr: 0x31
          data_value: 0x00

  - platform: template
    name: "Pergola RGB Read Brightness"
    on_press:
      - script.execute:
          id: send_t600_frame
          motor_addr: 0xFE
          device_type: 0x01
          command_code: 0x01
          data_addr: 0x32
          data_value: 0x00

  - platform: template
    name: "Pergola RGB Read Colour"
    on_press:
      - script.execute:
          id: send_t600_frame
          motor_addr: 0xFE
          device_type: 0x01
          command_code: 0x01
          data_addr: 0x34
          data_value: 0x00

